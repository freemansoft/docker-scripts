version: '3.3'
# created from https://opentelemetry.io/docs/collector/install/docker/
services:
  otel-collector:
    container_name: otel-collector
    hostname: otel-collector
    image: otel/opentelemetry-collector-contrib:latest
    command: [ "--config=/etc/otel-collector-config.yml" ]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - 4317:4317 # OTLP gRPC
      - 4318:4318 # OTLP HTTP
    # lets the container resolve host.docker.internal, needed to reach the
    # loki/ example's container across the docker-compose project boundary
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - private_net

# the actual name will be <directory_name>_<network_name>
networks:
  private_net:
    driver: bridge
