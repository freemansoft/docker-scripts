version: '3.5'
# :latest datastax is not maintained
# Need a version of docker-compose that supports network name

services:
  # DataStax Enterprise
  dse:
    # Specify the container name explicitly to avoid getting underscores
    container_name: dse
    image: datastax/dse-server:6.8.65
    # Enable Graph - -f enabled by default
    command: [ -g -s ]
    ports:
    - "9042:9042" # Expose cassandra to host
    - "8182:8182" # Expose graph to host
    - "9077:9077" # Expose always on sql to host
    environment:
      DS_LICENSE: accept
      HEAP_NEWSIZE: 128M
      MAX_HEAP_SIZE: 4G
      # DSE's startup script computes -XX:MaxDirectMemorySize as
      # (detected host memory - MAX_HEAP_SIZE) / 2. On a host/VM with less
      # memory available than MAX_HEAP_SIZE (common for local dev, e.g. a
      # 2GB Colima VM), that goes negative and crashes the JVM at startup.
      # Setting this explicitly bypasses the host-memory autodetection.
      MAX_DIRECT_MEMORY: 512M
    volumes:
    - dse_data:/var/lib/cassandra
    # Allow DSE to lock memory with mlock
    cap_add:
    - IPC_LOCK
    ulimits:
      memlock: -1
    networks:
      - dse

# One instance of DataStax Studio
  studio:
    container_name: studio
    image: datastax/dse-studio:6.8.32
    ports:
    - "9091:9091" # The Web UI exposed to our host
    depends_on:
    - dse
    environment:
      DS_LICENSE: accept
    volumes:
    - studio_notebooks:/var/lib/datastax-studio
    networks:
      - dse

volumes:
  # will be <dir_name>_data
  studio_notebooks:
    driver: local
  dse_data:
    driver: local

# the actual name will be <directory_name>_<network_name>
# specify name explicitly to avoid underscores
networks:
  dse:
    driver: bridge
    name: datastax
